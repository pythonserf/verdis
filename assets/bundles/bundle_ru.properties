planet.verdis-verdis.name = Вердис
planet.verdis-verdis.description = Крупная живая планета между Серпуло и Эрекиром, ближе к Серпуло. Землю покрывают мох и живые растения, атмосфера переливается фиолетовым и синим, а над поверхностью плывут белые облака.
planet.verdis-verdis-ship.name = Корабль
planet.verdis-verdis-ship.description = Наш корабль на орбите Вердиса.
sector.verdis-ship-deck.name = Палуба корабля
sector.verdis-ship-deck.description = Корабль на орбите Вердиса атакуют: абордажники лезут через пробоину в носу, истребители летят из космоса. Удержи палубу до 10-й волны.
sector.verdis-landing-glade.name = Посадочная поляна
sector.verdis-landing-glade.description = Тихая поляна среди мха и кустов. Немного меди и свинца, редкие волны. Продержись до 15-й волны.
sector.verdis-root-maze.name = Корневой лабиринт
sector.verdis-root-maze.description = Лабиринт из огромных корней. Обломки корабля пробили его насквозь, и где-то внутри упал один из генераторов для запуска. Волны только наземные: корни ведут их к ядру. Продержись до 25-й волны.
verdis.meteor.warning = [scarlet]Приближается метеорит![] Он упадёт на моховую площадку в металлической рамке.
verdis.meteor.impact = Метеорит упал и оставил кратер.
verdis.deck.1 = Бортовой журнал. Орбита Вердиса. Тревога: абордаж в носовом отсеке!
verdis.deck.2 = Удержать палубу, пока не войдём в атмосферу.
verdis.deck.3 = [scarlet]Прямое попадание в реактор![] Пожар на всех палубах!
verdis.deck.4 = Корабль сходит с орбиты... Падаем на Вердис!
verdis.intro.skip = Нажми, чтобы пропустить
verdis.intro.1 = Бортовой журнал. Вход в атмосферу Вердиса... Двигатели отказали, корпус разваливается!
verdis.intro.2 = Отсек с ядром оторвался и рухнул на поляну. Мы живы.
verdis.intro.3 = Корабль ушёл за горизонт и упал где-то далеко. Его ещё предстоит найти.
verdis.intro.4 = А пока надо закрепиться на поляне.
verdis.maze.1 = Бортовой журнал, ранняя запись. Корабль проходит над лабиринтом корней, теряя высоту.
verdis.maze.2 = Далеко впереди — сильнейший взрыв! Корпус разорвало на куски.
verdis.maze.3 = Обломки пробили корни. Сюда упал один из генераторов для запуска.
verdis.maze.4 = Без него не запустить самый мощный. Найди генератор в лабиринте.
verdis.finale.1 = [scarlet]Огромная сигнатура на радаре...[] Это Нуклеоид!
verdis.finale.2 = Наши стены его не остановят. Держитесь сколько сможете!
verdis.finale.3 = Ядро этого не выдержит. Экстренный взлёт — курс на корневой лабиринт!
