planet.verdis-verdis.name = Verdis
planet.verdis-verdis.description = A large living planet between Serpulo and Erekir, closer to Serpulo. Moss and living plants cover the ground, the atmosphere shimmers purple and blue, and white clouds drift above.
planet.verdis-verdis-ship.name = Ship
planet.verdis-verdis-ship.description = Our ship in orbit of Verdis.
sector.verdis-ship-deck.name = Ship Deck
sector.verdis-ship-deck.description = The ship in orbit of Verdis is under attack: boarders come through the bow breach, fighters come out of space. Hold the deck until wave 10.
sector.verdis-landing-glade.name = Landing Glade
sector.verdis-landing-glade.description = A quiet glade of moss and bushes. A little copper and lead, rare waves. Hold out until wave 15.
sector.verdis-root-maze.name = Root Maze
sector.verdis-root-maze.description = A maze of giant roots. Ship debris broke through it, and one of the launch generators fell somewhere inside. Ground waves only: the roots guide them to the core. Hold out until wave 25.
verdis.meteor.warning = [scarlet]A meteorite is coming![] It will hit the moss pad in the metal frame.
verdis.meteor.impact = The meteorite has fallen and left a crater.
verdis.deck.1 = Ship log. Orbit of Verdis. Alarm: boarders in the bow!
verdis.deck.2 = Hold the deck until we reach the atmosphere.
verdis.deck.3 = [scarlet]Direct hit in the reactor![] Fires on every deck!
verdis.deck.4 = The ship is leaving orbit... We are falling onto Verdis!
verdis.intro.skip = Click to skip
verdis.intro.1 = Ship log. Entering the atmosphere of Verdis... The engines are dead, the hull is breaking apart!
verdis.intro.2 = The core section broke off and crashed into the glade. We are alive.
verdis.intro.3 = The ship went over the horizon and fell somewhere far away. We will have to find it.
verdis.intro.4 = For now: hold the glade.
verdis.maze.1 = Ship log, earlier record. The ship passes over a maze of roots, losing height.
verdis.maze.2 = A huge explosion far ahead! The hull is torn apart.
verdis.maze.3 = Debris broke through the roots. One of the launch generators fell here.
verdis.maze.4 = We need it to launch the most powerful one. Find the generator in the maze.
verdis.finale.1 = [scarlet]Huge signal on the radar...[] It is a Nucleoid!
verdis.finale.2 = Our walls will not stop it. Hold on as long as you can!
verdis.finale.3 = The core will not survive this. Emergency take-off — heading for the Root Maze!
